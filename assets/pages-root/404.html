<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Served for any missing path, under whatever header rule matched it;
         this policy only ever narrows that, so a 404 can never fetch. -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; script-src 'none'" />
    <title>Not found</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0 auto; padding: 96px 24px; max-width: 720px;
        font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { font-size: 1.6rem; margin-bottom: 4px; }
      p { opacity: 0.8; }
      a { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>404 — no artifact here</h1>
    <p>
      This path does not match a published artifact. It may have been
      unpublished, renamed, or never existed.
    </p>
    <p>
      <a href="/">Browse the artifact index</a> or fetch
      <a href="/index.json">/index.json</a> for the machine-readable registry.
    </p>
  </body>
</html>
